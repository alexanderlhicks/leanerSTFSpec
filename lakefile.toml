name = "stfspec"
version = "0.0.0"
# The Mathlib-free executable core. This package must never `require` anything:
# the Mathlib boundary is enforced at the package level (CONTRIBUTING.md §4).
defaultTargets = ["EthBase", "EthHash", "EthField", "EthCurve", "EthPairing", "EthCodec", "EthState", "EthCommit", "EthStateCommit", "EthStateFull", "EthStateWitness", "EthVmCore", "EthVmInstructions", "EthPrecompiles", "EthVmRunner", "EthBlock", "EthFork", "EthStateless", "EthConformance", "check-decls"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "EthBase"
roots = ["STFSpec.Base"]

[[lean_lib]]
name = "EthHash"
roots = ["STFSpec.Hash"]

[[lean_lib]]
name = "EthField"
roots = ["STFSpec.Field"]

[[lean_lib]]
name = "EthCurve"
roots = ["STFSpec.Curve"]

[[lean_lib]]
name = "EthPairing"
roots = ["STFSpec.Pairing"]

[[lean_lib]]
name = "EthCodec"
roots = ["STFSpec.Codec"]

[[lean_lib]]
name = "EthState"
roots = ["STFSpec.State"]

[[lean_lib]]
name = "EthCommit"
roots = ["STFSpec.Commit"]

[[lean_lib]]
name = "EthStateCommit"
roots = ["STFSpec.StateCommit"]

[[lean_lib]]
name = "EthStateFull"
roots = ["STFSpec.StateFull"]

[[lean_lib]]
name = "EthStateWitness"
roots = ["STFSpec.StateWitness"]

[[lean_lib]]
name = "EthVmCore"
roots = ["STFSpec.Vm.Core"]

[[lean_lib]]
name = "EthVmInstructions"
roots = ["STFSpec.Vm.Instructions"]

[[lean_lib]]
name = "EthPrecompiles"
roots = ["STFSpec.Precompiles"]

[[lean_lib]]
name = "EthVmRunner"
roots = ["STFSpec.Vm.Runner"]

[[lean_lib]]
name = "EthBlock"
roots = ["STFSpec.Block"]

[[lean_lib]]
name = "EthFork"
roots = ["STFSpec.Fork"]

[[lean_lib]]
name = "EthStateless"
roots = ["STFSpec.Stateless"]

[[lean_lib]]
name = "EthConformance"
roots = ["STFSpec.Conformance"]

# Checks compiled declarations: axioms, sorry, unsafe/partial, extern/implemented_by, csimp.
[[lean_lib]]
name = "CheckDecls"
srcDir = "scripts"
roots = ["CheckDecls"]

# Compiled packed-byte regressions; build explicitly in CI, outside the public library.
[[lean_exe]]
name = "bytes-native-tests"
srcDir = "scripts"
root = "BytesNativeTests"

# Build and audit the local cost diagnostic in CI; measurements run manually.
[[lean_exe]]
name = "fixed-endian-bench"
srcDir = "scripts"
root = "FixedEndianBench"

# Build and audit complete packed/reference hash cost diagnostics; run timings manually.
[[lean_exe]]
name = "packed-keccak-bench"
srcDir = "scripts"
root = "PackedKeccakBench"

[[lean_exe]]
name = "check-decls"
srcDir = "scripts"
root = "CheckDeclsMain"
supportInterpreter = true
# Regression fixtures for check-decls itself (not a default target; see scripts/test_checks.sh).
[[lean_lib]]
name = "CheckDeclsTest"
srcDir = "scripts"
roots = ["CheckDeclsTest.Bad", "CheckDeclsTest.Good", "CheckDeclsTest.ProvedCsimp", "CheckDeclsTest.Superseded"]

# Internal authenticated-host extraction driver; no guest invocation.
[[lean_exe]]
name = "fixture-records"
srcDir = "scripts"
root = "FixtureRecordsMain"

# Complete compiled observations of the internal persistent first-write index.
[[lean_exe]]
name = "write-order-native-tests"
srcDir = "scripts"
root = "WriteOrderNativeTests"

# Complete raw MathState and observer regressions; no cost or whole-State claim.
[[lean_exe]]
name = "math-state-native-tests"
srcDir = "scripts"
root = "MathStateNativeTests"

# Complete raw BlockDiff observations, outside the public state library.
[[lean_exe]]
name = "block-diff-native-tests"
srcDir = "scripts"
root = "BlockDiffNativeTests"

# Complete raw mathematical application observations.
[[lean_exe]]
name = "apply-native-tests"
srcDir = "scripts"
root = "ApplyNativeTests"
