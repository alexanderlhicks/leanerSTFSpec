# Mathlib bridge package: Mathlib-dependent correctness results about the core (field
# isomorphisms, group laws, bilinearity; STFSpec/informal/ARCHITECTURE.md §3). It depends on the core;
# the core never depends on it. Security results are in ../STFSpecSecurity.
name = "STFSpecMathlib"
version = "0.0.0"
defaultTargets = ["EthFieldMathlib", "EthCurveMathlib", "EthPairingMathlib"]
# Mathlib sets `requiresModuleSystem`, so Lake warns (an error under `--wfail`) when a classic
# file imports it. This package stays classic (DECISIONS D28) and permits that import.
allowNonModules = true

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "stfspec"
path = ".."

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "EthFieldMathlib"
roots = ["STFSpecMathlib.Field"]

[[lean_lib]]
name = "EthCurveMathlib"
roots = ["STFSpecMathlib.Curve"]

[[lean_lib]]
name = "EthPairingMathlib"
roots = ["STFSpecMathlib.Pairing"]
