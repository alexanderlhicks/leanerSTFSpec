# Checks that hold from the first commit (CONTRIBUTING.md, STFSpec/informal/ARCHITECTURE.md §3).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly: full pinned-corpus verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_INIT: https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh

jobs:
  core:
    name: Core package (Mathlib-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: core-lake-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: core-lake-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
      - name: Build (warnings are errors)
        run: lake build --wfail
      - name: Compiled packed-byte regressions
        run: |
          lake build bytes-native-tests --wfail
          lake exe check-decls BytesNativeTests
          lake exe bytes-native-tests
      - name: Compiled first-write order regressions
        run: |
          lake build write-order-native-tests --wfail
          lake exe check-decls WriteOrderNativeTests
          lake exe write-order-native-tests
      - name: Complete mathematical-state regressions
        run: |
          lake build math-state-native-tests --wfail
          lake exe check-decls MathStateNativeTests
          lake exe math-state-native-tests
      - name: Fixed-endian benchmark build and declaration audit
        run: |
          lake build fixed-endian-bench --wfail
          lake exe check-decls FixedEndianBench
      - name: Packed Keccak benchmark build, declaration audit and generator freshness
        run: |
          lake build packed-keccak-bench --wfail
          lake exe check-decls PackedKeccakBench
          python3 scripts/gen_packed_keccak.py --check
          python3 scripts/test_packed_keccak_generator.py
      - name: Dependency and hygiene boundaries (source level)
        run: python3 scripts/check_boundaries.py
      - name: Declaration check (compiled; strict)
        run: scripts/check_decls.sh core
      - name: Checker regression tests
        run: |
          lake build CheckDeclsTest
          scripts/test_checks.sh
      - name: Differential oracle safeguard regressions
        run: python3 scripts/test_differential.py
      - name: Hash32 observation parser regressions
        run: |
          python3 -B scripts/test_hash32_output_parser.py
          python3 -B -O scripts/test_hash32_output_parser.py
      - name: NodeDB native output parser regressions
        run: |
          python3 -B scripts/test_node_db_output_parser.py
          python3 -B -O scripts/test_node_db_output_parser.py
      - name: Pinned reference consistency
        run: |
          python3 scripts/check_reference.py
          python3 scripts/test_reference_checks.py
      - name: README architecture diagram matches the registries and pin
        run: python3 scripts/gen_arch_diagram.py --check
      - name: Informal specification coverage and consistency
        run: python3 scripts/check_spec.py
      - name: Informal specification checker regressions
        run: python3 scripts/test_spec_checks.py
      - name: Gap register is up to date
        run: python3 scripts/gen_gaps.py --check
      - name: Deterministic conformance checks (core profile)
        run: |
          lake build EthConformance fixture-records --wfail
          python3 scripts/test_fixture_archive.py
      # The bounded EEST fixture slice runs here once the fixture runner exists
      # (STFSpec.Conformance); until then this job verifies only the pin (see `fixtures`).

  mathlib:
    name: Mathlib bridge and security packages
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # STFSpecSecurity shares STFSpecMathlib/.lake/packages (its packagesDir), so one cache serves both.
      - uses: actions/cache@v4
        with:
          path: STFSpecMathlib/.lake
          key: mathlib-lake-${{ hashFiles('lean-toolchain', 'STFSpecMathlib/lakefile.toml', 'STFSpecMathlib/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: mathlib-lake-${{ hashFiles('lean-toolchain', 'STFSpecMathlib/lakefile.toml', 'STFSpecMathlib/lake-manifest.json') }}-
      - name: Fetch Mathlib cache
        working-directory: STFSpecMathlib
        run: lake exe cache get
      - name: Build the Mathlib bridge package
        working-directory: STFSpecMathlib
        run: lake build --wfail
      - name: Declaration check, bridge package (sorry reported; everything else strict)
        run: scripts/check_decls.sh mathlib
      - name: Build the security package
        working-directory: STFSpecSecurity
        run: lake build --wfail
      - name: Declaration check, security package (sorry reported; everything else strict)
        run: scripts/check_decls.sh security

  fixtures:
    name: Pinned EEST zkevm corpus
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the fixture extractor
        run: lake build fixture-records --wfail
      - name: Download and verify the pinned fixture archive
        run: |
          python3 scripts/check_reference.py --fetch "$RUNNER_TEMP/fixtures"
          python3 scripts/gen_fixture_index.py "$RUNNER_TEMP/fixtures/fixtures_zkevm.tar.gz" --check
      - name: Authenticate metadata and compare full-corpus extracted bytes
        run: |
          python3 scripts/verify_fixture_archive.py "$RUNNER_TEMP/fixtures/fixtures_zkevm.tar.gz" \
            --lean-parser .lake/build/bin/fixture-records --lean-content-all \
            --report "$RUNNER_TEMP/fixture-extraction.json"
      # Guest execution is added here once the semantic fixture runner exists.
